components:
  schemas:
    AccessTokenCredentials:
      required:
      - grant_type
      type: object
      properties:
        client_id:
          type: string
          description: OAuth2 client identifier
          example: dns_ios
        code:
          type: string
          description: Authorization code received from the authorization server
          example: auth_code_xyz
        code_verifier:
          type: string
          description: PKCE code verifier (43-128 chars)
          example: E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM
        grant_type:
          type: string
          description: 'OAuth2 grant type. Accepted values: "password", "refresh_token",
            "authorization_code". Required for Authorization Code + PKCE flow.'
        mfa_token:
          type: string
          description: Two-Factor authentication token (if enabled in account settings)
          example: '123456'
        password:
          type: string
          description: Account password
          example: your_password
        redirect_uri:
          type: string
          description: Redirect URI used in the authorization request
          example: https://example.com/callback
        refresh_token:
          type: string
          description: Refresh token
          example: H3SW6YFJ-tOPe0FQCM1Jd6VnMiA
        username:
          type: string
          description: Account email
          example: user@example.com
      description: Access token request parameters
    AccessTokenErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error type
          example: unauthorized
        error_code:
          type: string
          description: Error code
          example: 2fa_required
        error_description:
          type: string
          description: Error description
          example: 2FA is required
      description: Access token error response
    AccessTokenResponse:
      required:
      - expires_in
      type: object
      properties:
        access_token:
          type: string
          description: Access token
          example: jTFho_aymtN20pZR5RRSQAzd81I
        expires_in:
          type: integer
          description: The lifetime in seconds of the access token
          format: int32
          example: 2620978
        refresh_token:
          type: string
          description: Refresh token
          example: H3SW6YFJ-tOPe0FQCM1Jd6VnMiA
        token_type:
          type: string
          description: The type of the token issued
          example: bearer
      description: Access token success response
    AccountLimits:
      required:
      - access_rules
      - dedicated_ipv4
      - devices
      - dns_servers
      - requests
      - user_rules
      type: object
      properties:
        access_rules:
          $ref: '#/components/schemas/Limit'
        dedicated_ipv4:
          $ref: '#/components/schemas/Limit'
        devices:
          $ref: '#/components/schemas/Limit'
        dns_servers:
          $ref: '#/components/schemas/Limit'
        requests:
          $ref: '#/components/schemas/Limit'
        user_rules:
          $ref: '#/components/schemas/Limit'
      description: Account limits
    BlockedFilteringCategoryUpdate:
      required:
      - id
      type: object
      properties:
        enabled:
          type: boolean
          description: Whether category blocking is enabled
        id:
          maxLength: 64
          minLength: 1
          type: string
          description: Category identifier
          example: adult
      description: Blocked filtering category update action
    BlockedParentalCategoryQueriesStats:
      required:
      - blocked
      - category
      type: object
      properties:
        blocked:
          type: integer
          description: Blocked queries count
          format: int64
          example: 14
        category:
          type: string
          description: Category
          example: audio
      description: Blocked Parental control Category queries stats
    BlockedParentalCategoryQueriesStatsList:
      required:
      - stats
      type: object
      properties:
        stats:
          type: array
          description: Stats for blocked Parental control Categories
          items:
            $ref: '#/components/schemas/BlockedParentalCategoryQueriesStats'
      description: Blocked Parental control Category queries stats
    BlockedWebService:
      required:
      - enabled
      - id
      type: object
      properties:
        enabled:
          type: boolean
          description: Whether service blocking is enabled
        id:
          type: string
          description: Web-service identifier
          example: 9gag
      description: Blocked web-service
    BlockedWebServiceUpdate:
      required:
      - id
      type: object
      properties:
        enabled:
          type: boolean
          description: Whether service blocking is enabled
        id:
          maxLength: 64
          minLength: 1
          type: string
          description: Web-service identifier
          example: 9gag
      description: Blocked web-service update action
    BlockingMode:
      type: string
      description: Blocking mode
      example: REFUSED
      enum:
      - NONE
      - NULL_IP
      - REFUSED
      - NXDOMAIN
      - CUSTOM_IP
    BlockingModeSettings:
      required:
      - blocking_mode
      type: object
      properties:
        blocking_mode:
          $ref: '#/components/schemas/BlockingMode'
        ipv4_blocking_address:
          type: string
          description: Custom IPv4 address for blocking mode CUSTOM IP
          example: 0.0.0.0
        ipv6_blocking_address:
          type: string
          description: Custom IPv6 address for blocking mode CUSTOM IP
          example: '::'
      description: Blocking mode settings
    BlockingModeSettingsUpdate:
      required:
      - blocking_mode
      type: object
      properties:
        blocking_mode:
          $ref: '#/components/schemas/BlockingMode'
        ipv4_blocking_address:
          type: string
          description: Custom IPv4 address for blocking mode CUSTOM IP
          example: 0.0.0.0
        ipv6_blocking_address:
          type: string
          description: Custom IPv6 address for blocking mode CUSTOM IP
          example: '::'
      description: Blocking mode settings
    CategoryQueriesStats:
      required:
      - category_type
      - queries
      type: object
      properties:
        category_type:
          $ref: '#/components/schemas/CategoryType'
        queries:
          type: integer
          description: Queries
          format: int64
          example: 86
      description: Category queries stats
    CategoryQueriesStatsList:
      required:
      - stats
      type: object
      properties:
        stats:
          type: array
          description: List of queries stats
          items:
            $ref: '#/components/schemas/CategoryQueriesStats'
      description: Category query statistics list
    CategoryType:
      type: string
      description: Category type
      enum:
      - ADS
      - TRACKERS
      - SOCIAL_MEDIA
      - CDN
      - OTHERS
    CompanyDetailedQueriesStats:
      required:
      - company_name
      - domains_count
      - top_queries_domain
      - value
      type: object
      properties:
        company_name:
          type: string
