            January 2027. Use `navigation` instead
          deprecated: true
          items:
            $ref: '#/components/schemas/Page'
        stats:
          type: array
          description: List of queries stats
          items:
            $ref: '#/components/schemas/CompanyDetailedQueriesStats'
      description: Company detailed queries statistics
    CompanyQueriesStats:
      required:
