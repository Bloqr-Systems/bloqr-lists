        from_time:
          $ref: '#/components/schemas/ScheduleTime'
        to_time:
          $ref: '#/components/schemas/ScheduleTime'
      description: Describes a schedule for day
    ScheduleDayUpdate:
      required:
      - day_of_week
      type: object
      properties:
        day_of_week:
          $ref: '#/components/schemas/DayOfWeek'
        enabled:
          type: boolean
          description: Whether this day schedule is enabled
        from_time:
          $ref: '#/components/schemas/ScheduleTime'
        to_time:
          $ref: '#/components/schemas/ScheduleTime'
      description: Describes a schedule for day
    ScheduleTime:
      required:
      - hours
      - minutes
