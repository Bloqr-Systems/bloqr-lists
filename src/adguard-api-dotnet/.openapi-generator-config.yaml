# OpenAPI Generator Configuration for AdGuard API C# Client
# This configuration ensures consistent and correct code generation with proper namespace handling
#
# Usage: openapi-generator-cli generate -c .openapi-generator-config.yaml

generatorName: csharp

# Input/Output Configuration
inputSpec: api/openapi.json
outputDir: .

# Package Configuration
packageName: AdGuard.ApiClient
packageVersion: 1.0.0
packageTitle: AdGuard API Client
packageCompany: AdGuard
packageProductName: AdGuard API Client

# C# Specific Configuration
targetFramework: net10.0
validatable: false
netCoreProjectFile: true
nullableReferenceTypes: true

# JSON Library Configuration - CRITICAL: Always use Newtonsoft.Json
# This prevents ambiguous references to Json* types from System.Text.Json
jsonLibrary: Newtonsoft.Json

# API Documentation
apiDocumentationUrl: https://adguard-dns.io/kb/private-dns/api/overview/

# Additional Properties for finer control
additionalProperties:
  # Suppress file overwrite warnings
  skipFormModel: false
  
  # Use file-based enum generation
  useCompilationUnit: false
  
  # Ensure we don't accidentally import System.Text.Json attributes
  disableRestClientCloneMethod: false

# Model Customization
modelPackage: AdGuard.ApiClient.Model
apiPackage: AdGuard.ApiClient.Api
clientPackage: AdGuard.ApiClient.Client

# Type Mappings - Explicit to prevent ambiguity
typeMapping:
  # Core .NET types
  DateTime: DateTime
  Date: DateTime
  
# Import Mappings - Lock to Newtonsoft.Json ONLY
importMapping:
  JsonConstructorAttribute: Newtonsoft.Json.JsonConstructorAttribute
  JsonConverterAttribute: Newtonsoft.Json.JsonConverterAttribute
  JsonPropertyAttribute: Newtonsoft.Json.JsonPropertyAttribute
  JsonIgnoreAttribute: Newtonsoft.Json.JsonIgnoreAttribute
  JsonObjectAttribute: Newtonsoft.Json.JsonObjectAttribute
  EnumMemberAttribute: System.Runtime.Serialization.EnumMemberAttribute

# File Generation Rules
fileNamingConvention: pascal

# Template Engine Configuration
templateDir: templates

# Code Generation Options
disallowAdditionalPropertiesIfNotPresent: false
enablePostProcessFile: false

# Documentation Options
documentationProvider: markdown

# Reserve Words
reservedWords:
  - abstract
  - base
  - bool
  - break
  - byte
  - case
  - catch
  - char
  - checked
  - class
  - const
  - continue
  - decimal
  - default
  - delegate
  - do
  - double
  - else
  - enum
  - event
  - explicit
  - extern
  - false
  - finally
  - fixed
  - float
  - for
  - foreach
  - goto
  - if
  - implicit
  - in
  - int
  - interface
  - internal
  - is
  - lock
  - long
  - namespace
  - new
  - null
  - object
  - operator
  - out
  - override
  - params
  - private
  - protected
  - public
  - readonly
  - ref
  - return
  - sbyte
  - sealed
  - short
  - sizeof
  - stackalloc
  - static
  - string
  - struct
  - switch
  - this
  - throw
  - true
  - try
  - typeof
  - uint
  - ulong
  - unchecked
  - unsafe
  - ushort
  - using
  - virtual
  - void
  - volatile
  - while
  - yield
