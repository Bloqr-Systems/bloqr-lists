      parameters:
      - description: Refresh token to revoke
        explode: true
        in: query
        name: refresh_token
        required: true
        schema:
          type: string
        style: form
      responses:
        "200":
          description: Refresh token revoked
      security: []
      summary: Revokes a refresh token
      tags:
      - Authentication
