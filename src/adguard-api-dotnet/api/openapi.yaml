components:
  schemas:
    AccessTokenCredentials:
      description: Access token request parameters
      properties:
        client_id:
          description: OAuth2 client identifier
          example: dns_ios
          type: string
        code:
          description: Authorization code received from the authorization server
          example: auth_code_xyz
          type: string
        code_verifier:
          description: PKCE code verifier (43-128 chars)
          example: E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM
          type: string
        grant_type:
          description: "OAuth2 grant type. Accepted values: \"password\", \"refresh_token\"\
            , \"authorization_code\". Required for Authorization Code + PKCE flow."
          type: string
        mfa_token:
          description: Two-Factor authentication token (if enabled in account settings)
          example: "123456"
          type: string
        password:
          description: Account password
          example: your_password
          type: string
        redirect_uri:
          description: Redirect URI used in the authorization request
          example: https://example.com/callback
          type: string
        refresh_token:
          description: Refresh token
          example: H3SW6YFJ-tOPe0FQCM1Jd6VnMiA
          type: string
        username:
          description: Account email
          example: user@example.com
          type: string
      required:
      - grant_type
      type: object
    AccessTokenErrorResponse:
      description: Access token error response
      example:
        error: unauthorized
        error_code: 2fa_required
        error_description: 2FA is required
      properties:
        error:
          description: Error type
          example: unauthorized
          type: string
        error_code:
          description: Error code
          example: 2fa_required
          type: string
        error_description:
          description: Error description
          example: 2FA is required
          type: string
      type: object
    AccessTokenResponse:
      description: Access token success response
      example:
        access_token: jTFho_aymtN20pZR5RRSQAzd81I
        expires_in: 2620978
        refresh_token: H3SW6YFJ-tOPe0FQCM1Jd6VnMiA
        token_type: bearer
      properties:
        access_token:
          description: Access token
          example: jTFho_aymtN20pZR5RRSQAzd81I
          type: string
        expires_in:
          description: The lifetime in seconds of the access token
          example: 2620978
          format: int32
          type: integer
        refresh_token:
          description: Refresh token
          example: H3SW6YFJ-tOPe0FQCM1Jd6VnMiA
          type: string
        token_type:
          description: The type of the token issued
          example: bearer
          type: string
      required:
      - expires_in
      type: object
    AccountLimits:
      description: Account limits
      example:
        access_rules:
          limit: 100
          used: 5
        dedicated_ipv4:
          limit: 100
          used: 5
        devices:
          limit: 100
          used: 5
        dns_servers:
          limit: 100
          used: 5
        requests:
          limit: 100
          used: 5
        user_rules:
          limit: 100
          used: 5
      properties:
        access_rules:
          $ref: "#/components/schemas/Limit"
        dedicated_ipv4:
          $ref: "#/components/schemas/Limit"
        devices:
          $ref: "#/components/schemas/Limit"
        dns_servers:
          $ref: "#/components/schemas/Limit"
        requests:
          $ref: "#/components/schemas/Limit"
        user_rules:
          $ref: "#/components/schemas/Limit"
      required:
      - access_rules
      - dedicated_ipv4
      - devices
      - dns_servers
      - requests
      - user_rules
      type: object
    BlockedFilteringCategoryUpdate:
      description: Blocked filtering category update action
      example:
        enabled: true
        id: adult
      properties:
        enabled:
          description: Whether category blocking is enabled
          type: boolean
        id:
          description: Category identifier
          example: adult
          maxLength: 64
          minLength: 1
          type: string
      required:
      - id
      type: object
    BlockedParentalCategoryQueriesStats:
      description: Blocked Parental control Category queries stats
      example:
        blocked: 14
        category: audio
      properties:
        blocked:
          description: Blocked queries count
          example: 14
          format: int64
          type: integer
        category:
          description: Category
          example: audio
          type: string
      required:
      - blocked
      - category
      type: object
    BlockedParentalCategoryQueriesStatsList:
      description: Blocked Parental control Category queries stats
      example:
        stats:
        - blocked: 14
          category: audio
        - blocked: 14
          category: audio
      properties:
        stats:
