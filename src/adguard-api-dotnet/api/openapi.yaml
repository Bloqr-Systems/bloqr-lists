openapi: 3.0.1
info:
  description: DNS API documentation
  title: AdGuard DNS API
  version: "1.15"
servers:
- url: https://api.adguard-dns.io
security:
- AuthToken: []
- ApiKey: []
tags:
- description: |
    Operations for obtaining and managing OAuth2 access tokens.
    Supports three grant types: password with optional 2FA, refresh token, and authorization code with PKCE.
    Use these endpoints to authenticate users and manage session lifecycle.
  name: Authentication
- description: |
    Operations for managing dedicated IPv4 addresses.
    A dedicated IP address provides a static DNS resolution endpoint for the account.
    Supports listing allocated addresses and allocating new ones.
  name: Dedicated IP addresses
- description: |
    Operations for viewing and managing the DNS query log.
    The query log stores DNS resolution records with filtering, device, and domain information.
    Supports retrieving filtered query logs and clearing the log history.
  name: Query log
- description: |
    Operations for retrieving DNS query statistics.
    Statistics provide aggregated data about DNS queries grouped by time, country, domain, device, company, and category.
    Supports time-bounded queries with optional filters and cursor-based pagination.
  name: Statistics
- description: |
    Operations for managing DNS server profiles.
    A DNS server profile defines filtering, parental control, and access settings for a group of devices.
    Supports creating, updating, removing DNS servers, managing their settings, and listing with pagination.
  name: DNS servers
- description: |
    Operations for retrieving account information.
    The account represents a user's subscription with associated limits and resources.
    Supports reading current usage and maximum values for devices, DNS servers, queries, and rules.
  name: Account
- description: |
    Operations for retrieving reference data used in DNS server configuration.
    Reference data includes filter lists for content blocking, web services for parental control,
    and filtering categories for content classification.
    Supports listing all available entries for each data type.
  name: Reference data
- description: |
    Operations for managing DNS client devices.
    A device represents a single client (phone, tablet, computer) connected to the account's DNS server.
    Supports listing, creating, updating, removing devices and managing their settings, dedicated IPs, and mobile configuration profiles.
  name: Devices
paths:
  /oapi/v1/account/limits:
    get:
      description: |
        Returns account limits for the current account.
        Use this endpoint to read current usage and maximum values before creating or updating resources.
      operationId: getAccountLimits
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountLimits"
          description: Returns account limits
      summary: Gets account limits
      tags:
      - Account
  /oapi/v1/dedicated_addresses/ipv4:
    get:
      description: |
        Returns a list of dedicated IPv4 addresses allocated for the account.
        Use this endpoint to review available dedicated addresses before linking them to devices.
      operationId: listDedicatedIPv4Addresses
      responses:
        "200":
          content:
            '*/*':
              schema:
                items:
                  $ref: "#/components/schemas/DedicatedIPv4Address"
                type: array
          description: Returns list of dedicated IPv4 addresses
      summary: Lists allocated dedicated IPv4 addresses
      tags:
      - Dedicated IP addresses
    post:
      description: |
        Allocates a new dedicated IPv4 address for the account.
        Use this endpoint when you need a static IP address for DNS resolution.
      operationId: allocateDedicatedIPv4Address
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DedicatedIPv4Address"
          description: New dedicated IPv4 allocated
        "429":
          description: Dedicated IPv4 count reached the limit
      summary: Allocates new dedicated IPv4
      tags:
      - Dedicated IP addresses
  /oapi/v1/devices:
    get:
      deprecated: true
      description: Method is deprecated and scheduled for removal in January 2027.
        Use the /oapi/v2 version instead.
      operationId: listDevices
      responses:
        "200":
          content:
            '*/*':
              schema:
                items:
                  $ref: "#/components/schemas/Device"
                type: array
          description: Returns list of devices
      summary: Lists devices
      tags:
      - Devices
    post:
      description: |
        Creates a new device in the account.
        Provide the required device fields in the request body.
      operationId: createDevice
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceCreate"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
          description: Device created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Validation failed
        "429":
          description: Devices count reached the limit
      summary: Creates a new device
      tags:
      - Devices
  /oapi/v1/devices/{device_id}:
    delete:
      description: |
        Removes a device from the account.
        Use this endpoint to delete a device that is no longer needed.
      operationId: removeDevice
      parameters:
      - explode: false
        in: path
        name: device_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: Device removed
        "404":
          description: Device not found
      summary: Removes a device
      tags:
      - Devices
    get:
      description: |
        Returns details of a specific device.
        Use this endpoint to retrieve device configuration and DNS connection information.
      operationId: getDevice
      parameters:
      - explode: false
        in: path
        name: device_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
          description: Returns device details
        "404":
          description: Device not found
      summary: Gets a device by ID
      tags:
      - Devices
    put:
      description: |
        Updates a device with the provided fields.
        Only the specified fields will be modified.
      operationId: updateDevice
      parameters:
      - explode: false
        in: path
        name: device_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceUpdate"
        required: true
      responses:
        "200":
          description: Device updated
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Validation failed
        "404":
          description: Device not found
      summary: Updates a device
      tags:
      - Devices
  /oapi/v1/devices/{device_id}/dedicated_addresses:
    get:
      description: |
        Returns dedicated IPv4 and IPv6 addresses assigned to a device.
        Use this endpoint to review dedicated addresses linked to a specific device.
      operationId: listDedicatedAddressesForDevice
      parameters:
      - explode: false
        in: path
        name: device_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DedicatedIps"
          description: Returns dedicated IPv4 and IPv6 addresses
      summary: Lists dedicated IPv4 and IPv6 addresses for a device
      tags:
      - Devices
  /oapi/v1/devices/{device_id}/dedicated_addresses/ipv4:
    delete:
      description: |
        Unlinks a dedicated IPv4 address from a device.
        Specify the IPv4 address to unlink as a query parameter.
      operationId: unlinkDedicatedIPv4Address
      parameters:
      - explode: false
        in: path
        name: device_id
        required: true
        schema:
          type: string
        style: simple
      - description: Dedicated IPv4 to unlink
        explode: true
        in: query
        name: ip
        required: true
        schema:
          type: string
        style: form
      responses:
        "200":
          description: Dedicated IPv4 unlinked from the device
        "404":
          description: Device or address not found
      summary: Unlinks dedicated IPv4 from the device
      tags:
      - Devices
    post:
      description: |
        Links a dedicated IPv4 address to a device.
        Provide the IPv4 address to link in the request body.
      operationId: linkDedicatedIPv4Address
      parameters:
      - explode: false
        in: path
        name: device_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkDedicatedIPv4"
        required: true
      responses:
        "200":
          description: Dedicated IPv4 linked to the device
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Validation failed
        "404":
          description: Device or address not found
        "429":
          description: Linked dedicated IPv4 count reached the limit
      summary: Links dedicated IPv4 to the device
      tags:
      - Devices
  /oapi/v1/devices/{device_id}/doh.mobileconfig:
    get:
      description: |
        Generates and downloads a DNS-over-HTTPS .mobileconfig profile for the device.
        Use this file to configure AdGuard DNS on iOS devices.
        Optional parameters allow excluding specific Wi-Fi networks and domains.
      operationId: getDoHMobileConfig
      parameters:
      - explode: false
        in: path
        name: device_id
        required: true
        schema:
          type: string
        style: simple
      - description: SSID list of Wi-Fi networks to exclude
        explode: true
        in: query
        name: exclude_wifi_networks
        required: false
        schema:
          items:
            type: string
          type: array
        style: form
      - description: Domain list to exclude from filtering
        explode: true
        in: query
        name: exclude_domain
        required: false
        schema:
          items:
            type: string
          type: array
        style: form
      responses:
        "200":
          description: DNS-over-HTTPS .mobileconfig profile
        "404":
          description: Device not found
      summary: Gets DNS-over-HTTPS .mobileconfig file
      tags:
      - Devices
  /oapi/v1/devices/{device_id}/doh_password/reset:
    put:
      description: |
        Generates a new DNS-over-HTTPS password for a device.
        Use this endpoint to reset the password if it has been compromised or you want to rotate credentials.
      operationId: resetDOHPassword
      parameters:
      - explode: false
        in: path
        name: device_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: DNS-over-HTTPS password reset
        "404":
          description: Device not found
      summary: Resets DNS-over-HTTPS password
      tags:
      - Devices
  /oapi/v1/devices/{device_id}/dot.mobileconfig:
    get:
      description: |
        Generates and downloads a DNS-over-TLS .mobileconfig profile for the device.
        Use this file to configure AdGuard DNS on iOS devices.
        Optional parameters allow excluding specific Wi-Fi networks and domains.
      operationId: getDoTMobileConfig
      parameters:
      - explode: false
        in: path
        name: device_id
        required: true
        schema:
          type: string
        style: simple
      - description: SSID list of Wi-Fi networks to exclude
        explode: true
        in: query
        name: exclude_wifi_networks
        required: false
        schema:
          items:
            type: string
          type: array
        style: form
      - description: Domain list to exclude from filtering
        explode: true
        in: query
        name: exclude_domain
        required: false
        schema:
          items:
            type: string
          type: array
        style: form
      responses:
        "200":
          description: DNS-over-TLS .mobileconfig profile
        "404":
          description: Device not found
      summary: Gets DNS-over-TLS .mobileconfig file
      tags:
      - Devices
  /oapi/v1/devices/{device_id}/settings:
    get:
      description: |
        Returns the current settings of a device, including protection and DNS-over-HTTPS authentication preferences.
      operationId: getDeviceSettings
      parameters:
      - explode: false
        in: path
        name: device_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceSettings"
          description: Returns device settings
        "404":
          description: Device not found
      summary: Gets device settings
      tags:
      - Devices
    put:
      description: |
        Updates device settings such as protection status and DNS-over-HTTPS authentication mode.
        Provide the settings to update in the request body.
      operationId: updateDeviceSettings
      parameters:
      - explode: false
        in: path
        name: device_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceSettingsUpdate"
        required: true
      responses:
        "200":
          description: Device settings updated
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Validation failed
        "404":
          description: Device not found
      summary: Updates device settings
      tags:
      - Devices
  /oapi/v1/dns_servers:
    get:
      deprecated: true
      description: Method is deprecated and scheduled for removal in January 2027.
        Use the /oapi/v2 version instead.
      operationId: listDNSServers
      responses:
        "200":
          content:
            '*/*':
              schema:
                items:
                  $ref: "#/components/schemas/DNSServer"
                type: array
          description: Returns list of DNS servers
      summary: Lists DNS servers
      tags:
      - DNS servers
    post:
      description: |
        Creates a new DNS server.
        You can attach custom settings via the request body; otherwise the server will be created with default settings.
      operationId: createDNSServer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DNSServerCreate"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DNSServer"
          description: DNS server created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Validation failed
        "429":
          description: DNS servers count reached the limit
      summary: Creates a new DNS server
      tags:
      - DNS servers
  /oapi/v1/dns_servers/{dns_server_id}:
    delete:
      description: |
        Removes a DNS server. All devices attached to this DNS server will be moved to the default DNS server.
        Deleting the default DNS server is forbidden.
      operationId: removeDNSServer
      parameters:
      - explode: false
        in: path
        name: dns_server_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: DNS server removed
        "404":
          description: DNS server not found
      summary: Removes a DNS server
      tags:
      - DNS servers
    get:
      description: |
        Returns details of a specific DNS server.
        Use this endpoint to retrieve DNS server configuration including its linked devices.
      operationId: getDNSServer
      parameters:
      - explode: false
        in: path
        name: dns_server_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DNSServer"
          description: Returns DNS server details
        "404":
          description: DNS server not found
      summary: Gets a DNS server by ID
      tags:
      - DNS servers
    put:
      description: |
        Updates a DNS server with the provided fields.
        Only the specified fields will be modified.
      operationId: updateDNSServer
      parameters:
      - explode: false
        in: path
        name: dns_server_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DNSServerUpdate"
        required: true
      responses:
        "200":
          description: DNS server updated
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Validation failed
        "404":
          description: DNS server not found
      summary: Updates a DNS server
      tags:
      - DNS servers
  /oapi/v1/dns_servers/{dns_server_id}/settings:
    get:
      description: |
        Returns the current settings of a DNS server, including filtering, parental control, and access configuration.
        Use this endpoint to review the current configuration before making changes.
      operationId: getDNSServerSettings
      parameters:
      - explode: false
        in: path
        name: dns_server_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DNSServerSettings"
          description: Returns DNS server settings
        "404":
          description: DNS server not found
      summary: Gets DNS server settings
      tags:
      - DNS servers
    put:
      description: |
        Updates the settings of a DNS server, such as filtering, parental control, and access configuration.
        Provide the settings to update in the request body.
      operationId: updateDNSServerSettings
      parameters:
      - explode: false
        in: path
        name: dns_server_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DNSServerSettingsUpdate"
        required: true
      responses:
        "200":
          description: DNS server settings updated
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Validation failed
        "404":
          description: DNS server not found
      summary: Updates DNS server settings
      tags:
      - DNS servers
  /oapi/v1/filter_lists:
    get:
      description: |
        Returns available filter lists for the current locale.
        Use this endpoint to retrieve filter definitions before applying them to DNS server settings.
      operationId: listFilterLists
      responses:
        "200":
          content:
            '*/*':
              schema:
                items:
                  $ref: "#/components/schemas/FilterList"
                type: array
          description: Returns list of filters
      summary: Lists filter lists
      tags:
      - Reference data
  /oapi/v1/oauth_authorize:
    get:
      description: |
        Initiates an OAuth2 authorization flow by redirecting the user to the AdGuard authorization server.

        Use `response_type=token` for the Implicit grant or `response_type=code` together with `code_challenge` and `code_challenge_method=S256` for the Authorization Code + PKCE flow.

        On success the authorization server redirects back to `redirect_uri`. For the Implicit grant the access token is embedded in the URL fragment (`#access_token=...`). For the Authorization Code flow a one-time `code` is appended as a query parameter and must be exchanged for tokens via the `/oauth_token` endpoint.
      operationId: authorize
      parameters:
      - description: OAuth2 client identifier
        explode: true
        in: query
        name: client_id
        required: true
        schema:
          type: string
        style: form
      - description: "Type of grant. Use response_type=token for Implicit grant, response_type=code\
          \ for Authorization Code + PKCE flow"
        explode: true
        in: query
        name: response_type
        required: true
        schema:
          type: string
        style: form
      - description: A successful response results in a redirect to this URL
        explode: true
        in: query
        name: redirect_uri
        required: true
        schema:
          type: string
        style: form
      - description: "An opaque value, used for security purposes"
        explode: true
        in: query
        name: state
        required: false
        schema:
          type: string
        style: form
      - description: Affiliate identifier
        explode: true
        in: query
        name: aid
        required: false
        schema:
          type: string
        style: form
      - description: Affiliate source
        explode: true
        in: query
        name: source
        required: false
        schema:
          type: string
        style: form
      - description: "PKCE code challenge: BASE64URL(SHA256(code_verifier)). Required\
          \ for Authorization Code + PKCE flow"
        explode: true
        in: query
        name: code_challenge
        required: false
        schema:
          type: string
        style: form
      - description: PKCE challenge method. Only "S256" is supported
        explode: true
        in: query
        name: code_challenge_method
        required: false
        schema:
          type: string
        style: form
      responses:
        "302":
          description: Redirect to the authorization server
      security: []
      summary: Redirects to the authorization endpoint
      tags:
      - Authentication
  /oapi/v1/oauth_token:
    post:
      description: |
        Obtains an access token using one of three grant types:

        **1. Password + optional 2FA** (`grant_type=password`):
        Provide `username` and `password`. If two-factor authentication is enabled on the account,
        also provide `mfa_token`.

        **2. Refresh token** (`grant_type=refresh_token`):
        Provide `refresh_token` to exchange it for a new access token without re-entering credentials.

        **3. Authorization Code + PKCE** (`grant_type=authorization_code`):
        Exchange an authorization code obtained via the `/oauth_authorize` endpoint.
        Provide `code`, `client_id`, `code_verifier`, and `redirect_uri`.
      operationId: accessToken
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/AccessTokenCredentials"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponse"
          description: Access token issued
        "400":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Missing required parameters
        "401":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AccessTokenErrorResponse"
          description: "Invalid credentials, MFA token, refresh token, authorization\
            \ code, or PKCE code_verifier provided"
      security: []
      summary: Issues an access token
      tags:
      - Authentication
  /oapi/v1/parental_control_categories:
    get:
      description: |
        Returns all available parental control filtering categories.
        Use this endpoint to retrieve categories for configuring parental control settings on a DNS server.
      operationId: listParentalControlFilteringCategories
      responses:
        "200":
          content:
            '*/*':
              schema:
                items:
                  $ref: "#/components/schemas/ParentalControlFilteringCategory"
                type: array
          description: Returns list of parental control filtering categories
      summary: Lists all parental control filtering categories
      tags:
      - Reference data
  /oapi/v1/query_log:
    delete:
      description: |
        Clears all query log entries for the current account.
        Use this endpoint to remove stored DNS query records.
      operationId: clearQueryLog
      responses:
        "202":
          description: Query log cleared
      summary: Clears query log
      tags:
      - Query log
    get:
      description: |
        Returns the query log for the specified time period.
        Use filters to narrow the result set and cursor to paginate through the results.
        The log contains DNS query records with filtering, device, and domain information.
      operationId: getQueryLog
      parameters:
      - description: Time from in milliseconds (inclusive)
        explode: true
        in: query
        name: time_from_millis
        required: true
        schema:
          format: int64
          type: integer
        style: form
      - description: Time to in milliseconds (inclusive)
        explode: true
        in: query
        name: time_to_millis
        required: true
        schema:
          format: int64
          type: integer
        style: form
      - description: Filter by DNS servers
        explode: true
        in: query
        name: dns_servers
        required: false
        schema:
          items:
            type: string
          type: array
          uniqueItems: true
        style: form
      - description: Filter by devices
        explode: true
        in: query
        name: devices
        required: false
        schema:
          items:
            type: string
          type: array
          uniqueItems: true
        style: form
      - description: Filter by countries
        explode: true
        in: query
        name: countries
        required: false
        schema:
          items:
            type: string
          type: array
          uniqueItems: true
        style: form
      - description: Filter by companies
        explode: true
        in: query
        name: companies
        required: false
        schema:
          items:
            type: string
          type: array
          uniqueItems: true
        style: form
      - description: Filter by statuses
        explode: true
        in: query
        name: statuses
        required: false
        schema:
          items:
            $ref: "#/components/schemas/FilteringActionStatus"
          type: array
          uniqueItems: true
        style: form
      - description: Filter by categories
        explode: true
        in: query
        name: categories
        required: false
        schema:
          items:
            $ref: "#/components/schemas/CategoryType"
          type: array
          uniqueItems: true
        style: form
      - description: Filter by domain name
        explode: true
        in: query
        name: search
        required: false
        schema:
          type: string
        style: form
      - description: Pagination limit
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 20
          format: int32
          maximum: 1000
          type: integer
        style: form
      - description: Pagination cursor from previous response
        explode: true
        in: query
        name: cursor
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryLogResponse"
          description: Returns query log
      summary: Gets query log
      tags:
      - Query log
  /oapi/v1/revoke_token:
    post:
      description: |
        Permanently invalidates a refresh token.
